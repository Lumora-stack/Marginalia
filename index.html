<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#F7F5F1" />
    <meta name="color-scheme" content="light" />
    <title>Artville · A personal publication</title>
    <!-- Inline theme init: prevents flash of wrong theme on load -->
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'acid-lime') {
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.add('dark');
        } else if (theme === 'light' || theme === 'dark' || theme === 'system') {
          document.documentElement.dataset.theme = theme;
        }
        if (theme === 'dark' || theme === 'acid-lime' || ((theme === 'system' || !theme) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        var isDark = document.documentElement.classList.contains('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'acid-lime' ? '#030407' : isDark ? '#0C0C0E' : '#F7F5F1');
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', isDark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
